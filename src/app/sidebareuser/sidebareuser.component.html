<aside class="sidebar-premium" [class.rtl]="isRtl">
  <div class="sidebar-header">
    <div class="avatar-wrapper">
      <img [src]="user.avatarUrl" alt="avatar" class="avatar-premium" />
      <span class="badge-premium" *ngIf="user.badge">{{ user.badge | translate }}</span>
    </div>
    <div class="user-info">
      <div class="user-name">{{ user.name }}</div>
      <div class="user-role">{{ user.role | translate }}</div>
    </div>
  </div>
  <nav class="sidebar-menu">
    <ul>
      <li *ngFor="let item of menu" [class.active]="item.active">
        <a (click)="onMenuClick(item)">
          <i [class]="item.icon"></i>
          <span>{{ item.label | translate }}</span>
          <span class="menu-badge" *ngIf="item.badge">{{ item.badge }}</span>
          <i *ngIf="item.children" class="arrow" [class.open]="item.open"></i>
        </a>
        <ul *ngIf="item.children && item.open" class="submenu">
          <li *ngFor="let sub of item.children" [class.active]="sub.active">
            <a (click)="onMenuClick(sub)">
              <i [class]="sub.icon"></i>
              <span>{{ sub.label | translate }}</span>
              <span class="menu-badge" *ngIf="sub.badge">{{ sub.badge }}</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="sidebar-footer">
    <button class="theme-btn" (click)="toggleTheme()" title="Toggle theme">
      <i [class]="themeIcon"></i>
    </button>
    <button class="lang-btn" (click)="toggleLang()" title="Change language">
      <i [class]="langIcon"></i>
    </button>
    <button class="logout-btn" (click)="logout()">
      <i class="fa fa-sign-out-alt"></i>
      <span>{{ 'SIDEBAR.LOGOUT' | translate }}</span>
    </button>
  </div>
</aside>
