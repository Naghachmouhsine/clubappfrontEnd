<ion-header translucent>
  <ion-toolbar class="glass-header">
    <ion-title>{{ isEdit ? 'Modifier' : 'Ajouter' }} un événement</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Fermer</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding glass-modal">
  <form (ngSubmit)="submitForm()">
    <ion-item>
      <ion-label position="floating">Nom *</ion-label>
      <ion-input [(ngModel)]="evenement.nom" name="nom" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Description</ion-label>
      <ion-input [(ngModel)]="evenement.description" name="description"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Date *</ion-label>
      <ion-input type="date" [(ngModel)]="evenement.date" name="date" required></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="floating">Lieu</ion-label>
      <ion-input [(ngModel)]="evenement.lieu" name="lieu"></ion-input>
    </ion-item>

    <ion-button expand="block" class="mt-3" type="submit">
      {{ isEdit ? 'Enregistrer les modifications' : 'Ajouter' }}
    </ion-button>
  </form>
</ion-content>
