<section class="py-5 section-gallery">
  <div class="container-fluid px-3">
    <h2 class="gallery-title text-center mb-5 fw-bold">
      {{ 'gallery.title' | translate }}
    </h2>
    <div class="row g-3 justify-content-center">
      <div class="col-6 col-md-3" *ngFor="let img of images">
        <div class="gallery-img-wrapper shadow-sm rounded-4 overflow-hidden">
          <img [src]="img" class="img-fluid gallery-img" alt="{{ 'gallery.title' | translate }}" />
        </div>
      </div>
    </div>
  </div>
</section>
