<section id="services" class="py-5">
  <div class="container-fluid px-3">
    <h2 class="text-center mb-5 fw-bold services-title">
      {{ 'home.services.title' | translate }}
    </h2>

    <div class="row g-4 justify-content-center">
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3"
        *ngFor="let service of services"
      >
        <div
          class="card service-card h-100 text-center p-4"
          (click)="naviguerVers(service.route)"
        >
          <div class="mb-3">
            <i [class]="service.icon" class="icon-service"></i>
          </div>
          <h5 class="fw-bold">{{ service.title | translate }}</h5>
          <p class="text-muted">{{ service.desc | translate }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
