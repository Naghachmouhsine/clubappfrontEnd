<app-header [nomPage]="'home_r.title' | translate"></app-header>
<ion-content class="ion-padding section-alt">
  <ion-card class="card-royal p-4">
    <ion-card-header>
      <ion-card-title class="services-title display-6 mb-3">🎾 {{ 'home_r.card_title' | translate }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="12" size-md="2" size-lg="6" *ngFor="let a of activites">
            <div class="activity-card card-royal shadow-sm mb-4" (click)="choisirActivite(a)">
              <img [src]="a.image" alt="{{ a.nom }}" class="img-fluid rounded-3 mb-2" />
              <div class="overlay">
                <h2 class="services-title">{{ a.emoji }} {{ ('home_r.activities.' + a.nom) | translate }}</h2>
              </div>
            </div>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
