<div class="popup-modal">
  <button class="close-btn" (click)="close()" aria-label="Fermer">
    <ion-icon name="close-outline"></ion-icon>
  </button>
  <form [formGroup]="passwordForm" (ngSubmit)="submit()" class="popup-form">
    <div class="avatar-premium mb-2 mx-auto">
      <ion-icon name="key" class="gold-avatar"></ion-icon>
    </div>
    <ion-list lines="none">
      <ion-item>
        <ion-label position="floating">{{ 'settings.old_password' | translate }}</ion-label>
        <ion-input [type]="hideOld ? 'password' : 'text'" formControlName="oldPassword"></ion-input>
        <ion-icon slot="end" [name]="hideOld ? 'eye-off-outline' : 'eye-outline'" (click)="hideOld = !hideOld"></ion-icon>
      </ion-item>
      <ion-item>
        <ion-label position="floating">{{ 'settings.new_password' | translate }}</ion-label>
        <ion-input [type]="hideNew ? 'password' : 'text'" formControlName="newPassword"></ion-input>
        <ion-icon slot="end" [name]="hideNew ? 'eye-off-outline' : 'eye-outline'" (click)="hideNew = !hideNew"></ion-icon>
      </ion-item>
      <ion-item>
        <ion-label position="floating">{{ 'settings.confirm_password' | translate }}</ion-label>
        <ion-input [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword"></ion-input>
        <ion-icon slot="end" [name]="hideConfirm ? 'eye-off-outline' : 'eye-outline'" (click)="hideConfirm = !hideConfirm"></ion-icon>
      </ion-item>
    </ion-list>
    <div *ngIf="errorMsg" class="text-danger small mt-2">{{ errorMsg | translate }}</div>
    <ion-button expand="block" type="submit" [disabled]="loading || passwordForm.invalid" class="mt-3 gold-btn">
      <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
      <span *ngIf="!loading">{{ 'settings.save' | translate }}</span>
    </ion-button>
  </form>
</div>
