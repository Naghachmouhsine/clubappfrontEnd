<app-header [nomPage]="'settings.title' | translate"></app-header>
<ion-content [fullscreen]="true" class="ion-padding bg-light">
  <div class="container py-4 d-flex justify-content-center align-items-center settings-container">
    <div class="card shadow-lg p-4 settings-card" style="max-width: 480px; width: 100%; border-radius: 1.5rem;">
      <h3 class="mb-4 text-center text-gold"><i class="bi bi-gear me-2"></i>{{ 'settings.title' | translate }}</h3>
      <div class="list-group list-group-flush mb-4">
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-person me-2"></i>{{ 'settings.account' | translate }}</span>
          <button class="btn btn-outline-warning btn-sm" (click)="editAccount()">{{ 'settings.edit' | translate }}</button>
        </div>
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-key me-2"></i>{{ 'settings.change_password' | translate }}</span>
          <button class="btn btn-outline-primary btn-sm" (click)="changePassword()">{{ 'settings.edit' | translate }}</button>
        </div>
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-moon-stars me-2"></i>{{ 'settings.theme' | translate }}</span>
          <button class="btn btn-outline-success btn-sm" (click)="changeTheme()">{{ 'settings.edit' | translate }}</button>
        </div>
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-translate me-2"></i>{{ 'settings.language' | translate }}</span>
          <button class="btn btn-outline-info btn-sm" (click)="changeLanguage()">{{ 'settings.edit' | translate }}</button>
        </div>
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-bell me-2"></i>{{ 'settings.notifications' | translate }}</span>
          <button class="btn btn-outline-secondary btn-sm" (click)="editNotifications()">{{ 'settings.edit' | translate }}</button>
        </div>
        <div class="list-group-item bg-transparent border-0 px-0 py-2 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-shield-lock me-2"></i>{{ 'settings.security' | translate }}</span>
          <button class="btn btn-outline-danger btn-sm" (click)="editSecurity()">{{ 'settings.edit' | translate }}</button>
        </div>
      </div>
      <div class="text-center mt-3">
        <button class="btn btn-outline-danger px-4" (click)="deleteAccount()">
          <i class="bi bi-trash me-2"></i>{{ 'settings.delete_account' | translate }}
        </button>
      </div>
    </div>
  </div>
</ion-content>
