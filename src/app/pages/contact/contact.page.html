<ion-header [translucent]="true">
 
</ion-header>

<ion-content [fullscreen]="true" class="section-alt">
  <ion-card class="card-royal p-4 mx-auto" style="max-width:600px;">
    <ion-card-header>
      <ion-card-title class="services-title display-6 mb-3">📞 Contact</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form>
        <ion-item class="mb-3">
          <ion-label position="floating">Nom</ion-label>
          <ion-input type="text" required></ion-input>
        </ion-item>
        <ion-item class="mb-3">
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" required></ion-input>
        </ion-item>
        <ion-item class="mb-3">
          <ion-label position="floating">Message</ion-label>
          <ion-textarea rows="4" required></ion-textarea>
        </ion-item>
        <ion-button expand="block" class="btn-gold btn-lg shadow">Envoyer</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
