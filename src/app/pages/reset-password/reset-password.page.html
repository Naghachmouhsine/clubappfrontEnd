<ion-content class="ion-padding section-alt login-content">
  <div class="auth-container">
    <div class="container login-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
      <div class="card card-royal shadow-lg p-4 animate__animated animate__fadeInDown" style="width: 100%; max-width: 450px;">
        <div class="text-center mb-4">
          <img src="assets/images/club-logo.png" alt="Logo" class="login-logo mb-3">
          <h2 class="fw-bold mt-3 login-title">🔐 Réinitialisation</h2>
          <p class="text-muted">Définissez un nouveau mot de passe sécurisé.</p>
        </div>

        <div *ngIf="!isTokenValid" class="alert alert-danger text-center">{{ errorMessage }}</div>

        <form *ngIf="isTokenValid" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-bold">Nouveau mot de passe</label>
            <input type="password" [(ngModel)]="newPassword" name="newPassword" class="form-control rounded-pill shadow-sm"
              placeholder="••••••••" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Confirmer le mot de passe</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control rounded-pill shadow-sm"
              placeholder="••••••••" required>
            <small class="text-danger" *ngIf="newPassword !== confirmPassword && confirmPassword">
              Les mots de passe ne correspondent pas.
            </small>
          </div>
          <button class="btn btn-gold btn-lg w-100 shadow-lg" type="submit"
            [disabled]="!newPassword || !confirmPassword || newPassword !== confirmPassword">
            Réinitialiser
          </button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
