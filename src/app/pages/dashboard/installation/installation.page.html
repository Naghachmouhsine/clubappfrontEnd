<app-header nomPage="Dashboard - Installations" ></app-header>
<ion-content class="ion-padding section-alt">
  <ion-card class="card-royal">
    <ion-card-header>
      <ion-card-title class="services-title">Liste des installations</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-button expand="block" (click)="addInstallation()" class="btn-gold">
        <ion-icon slot="start" name="add-circle-outline"></ion-icon>
        Ajouter une installation
      </ion-button>

      <ion-grid *ngIf="installations.length > 0">
        <ion-row class="ion-text-center fw-bold bg-gold-contrast rounded-3 shadow-sm mb-2 py-2">
          <ion-col>Nom</ion-col>
          <ion-col>Type</ion-col>
          <ion-col>Capacite</ion-col>
          <ion-col>Disponible</ion-col>
          <ion-col>Action</ion-col>
        </ion-row>

        <ion-row *ngFor="let installation of installations"
                 class="ion-text-center installation-row"
                 [ngClass]="getDisponibiliteClass(installation.disponible)">
          <ion-col class="installation-cell">{{ installation.nom }}</ion-col>
          <ion-col class="installation-cell">{{ installation.type }}</ion-col>
          <ion-col class="installation-cell">{{ installation.capacite }}</ion-col>
          <ion-col class="installation-cell">{{ installation.disponible }}</ion-col>
          <ion-col>
            <ion-button fill="clear" color="primary" (click)="detailInstallation(installation.id)" class="rounded-pill">
              <ion-icon name="eye-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="warning"  (click)="editInstallation(installation.id)" class="rounded-pill">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" (click)="deleteInstallation(installation.id)" class="rounded-pill">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>

      <div *ngIf="installations.length === 0" class="ion-text-center empty-state">
        <p>Aucune installation enregistrée pour le moment.</p>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
