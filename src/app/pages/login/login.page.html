<ion-content class="ion-padding section-alt login-content">
  <div class="auth-container">
    <div class="container login-container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
      <div class="card card-royal shadow-lg p-4 animate__animated animate__fadeInDown">
        <div class="text-center mb-4">
          <img src="assets/images/club-logo.png" alt="Logo" class="login-logo mb-3 animate__animated animate__pulse animate__delay-1s">
          <h2 class="fw-bold mt-3 login-title">{{ 'login.title' | translate }}</h2>
          <p class="text-muted">{{ 'login.subtitle' | translate }}</p>
        </div>
        <form (ngSubmit)="onLogin()">
          <div class="mb-3">
            <label class="form-label fw-bold">{{ 'login.email' | translate }}</label>
            <input type="email" class="form-control rounded-pill shadow-sm"
              [ngClass]="{'border-gold': email && email.length > 0 && !email.includes('@')}"
              [(ngModel)]="email" name="email" placeholder="{{ 'login.email_placeholder' | translate }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">{{ 'login.password' | translate }}</label>
            <input type="password" class="form-control rounded-pill shadow-sm"
              [ngClass]="{'border-gold': password && password.length > 0 && password.length < 6}"
              [(ngModel)]="password" name="password" placeholder="{{ 'login.password_placeholder' | translate }}" required>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
              <span (click)="navigateTO('/forgot-password')" class="small text-gold" style="cursor: pointer;">
                {{ 'login.forgot' | translate }}
              </span>
              <span (click)="navigateTO('/register')" class="small text-gold fw-bold" style="cursor: pointer;">
                {{ 'login.create_account' | translate }}
              </span>
          </div>
          <button type="submit" class="btn btn-gold btn-lg w-100 shadow-lg" [disabled]="!email || !password">
            {{ 'login.login' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</ion-content>
